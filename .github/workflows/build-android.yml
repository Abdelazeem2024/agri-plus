name: بناء تطبيق أندرويد (Agri Plus)

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: تحميل كود المشروع
        uses: actions/checkout@v4

      - name: تجهيز Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تجهيز Java (مطلوب لبناء أندرويد)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: تجهيز Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت حزم المشروع
        run: npm install

      - name: بناء واجهة الويب (نفس ما يُستخدم في نسخة الويندوز)
        run: npm run build

      - name: إضافة منصة أندرويد (إن لم تكن مُضافة بالفعل في المستودع)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: توليد أيقونة التطبيق وشاشة البداية من الشعار
        run: npx capacitor-assets generate --android

      - name: منح صلاحية التنفيذ لسكربت البناء
        run: chmod +x android/gradlew

      - name: بناء ملف APK
        run: cd android && ./gradlew assembleDebug

      - name: رفع ملف APK كنتيجة قابلة للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: AgriPlus-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
